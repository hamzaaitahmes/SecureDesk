name: securedesk

services:
  mongo:
    image: mongo:7-jammy
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/securedesk
      JWT_SECRET: ${JWT_SECRET:-securedesk_local_change_this_key_2026_very_long}
      JWT_EXPIRES_IN: 8h
      CLIENT_URL: http://localhost:3000,http://127.0.0.1:3000
      COOKIE_SECURE: "false"
      SEED_DEMO: "true"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - uploads_data:/app/src/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo_data:
  uploads_data:

